name: CI

# lint・テスト・ビルドを、flake.nix の devShell の中で make のターゲットとして実行する。
# make だけを実行するとランナーにあるツールが使われ、ローカルとバージョンがずれるため、
# nix develop -c で flake.lock に固定したツールを使う
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/**"
  # CD（cd.yml）から呼ぶ
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint, test and build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flakes は既定で有効。github: の入力の取得には github.token を使う
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # nix のストア（go・golangci-lint などのツール）をキャッシュする。
      # ツールが変わるのは flake.nix・flake.lock が変わったときだけなので、それをキーにする。
      # キーが一致しないときは、前のキャッシュから戻して差分だけを取得する
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Go のモジュール・ビルドのキャッシュと、golangci-lint の解析のキャッシュ。
      # Go のバージョン（flake.lock）が変わるとビルドのキャッシュが使えなくなるので、キーに含める
      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'flake.lock') }}
          restore-keys: go-${{ runner.os }}-

      # devShell の用意（ツールの取得）を、lint などのステップと分けて時間を見られるようにする
      - name: Set up dev shell
        run: nix develop -c go version

      - name: Lint
        run: nix develop -c make lint

      - name: Lint workflows
        run: nix develop -c actionlint

      - name: Test
        run: nix develop -c make test

      - name: Build
        run: nix develop -c make build
