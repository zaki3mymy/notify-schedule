name: CI

# lint・テスト・ビルドを、flake.nix の devShell の中で make のターゲットとして実行する。
# make だけを実行するとランナーにあるツールが使われ、ローカルとバージョンがずれるため、
# nix develop -c で flake.lock に固定したツールを使う
on:
  pull_request:
    branches: [main, develop]
    paths: &paths
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - "Makefile"
      - ".golangci.yml"
      - "Containerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  # キャッシュを作るため、develop・main への push でも動かす（キャッシュは PR では保存しない）。
  # CD（#18）が workflow_call でこのワークフローを呼ぶようになったら、二重に動かないよう push は外す
  push:
    branches: [main, develop]
    paths: *paths
  # CD（cd.yml）から呼ぶ
  workflow_call:

permissions:
  contents: read

env:
  # キャッシュは develop・main への push（と、そこから呼ばれたとき）だけで保存する。
  # PR で作ったキャッシュはその PR でしか使えず、リポジトリのキャッシュの容量（10GB）を埋めるだけなので、
  # PR では develop・main のキャッシュを読むだけにする
  SAVE_CACHE: ${{ github.event_name != 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint, test and build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flakes は既定で有効。github: の入力の取得には github.token を使う
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # nix のストア（go・golangci-lint などのツール）をキャッシュする。
      # ツールが変わるのは flake.nix・flake.lock が変わったときだけなので、それをキーにする。
      # キーが一致しないときは、前のキャッシュから戻して差分だけを取得する
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ env.SAVE_CACHE }}

      # Go のモジュール・ビルドのキャッシュと、golangci-lint の解析のキャッシュ。
      # Go のバージョン（flake.lock）が変わるとビルドのキャッシュが使えなくなるので、キーに含める。
      # 保存は最後のステップで、SAVE_CACHE のときだけ行う
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'flake.lock') }}
          restore-keys: go-${{ runner.os }}-

      # devShell の用意（ツールの取得）を、lint などのステップと分けて時間を見られるようにする
      - name: Set up dev shell
        run: nix develop -c go version

      - name: Lint
        run: nix develop -c make lint

      - name: Lint workflows
        run: nix develop -c actionlint

      - name: Test
        run: nix develop -c make test

      # カバレッジを、ジョブのサマリー（Actions の実行結果の画面）と、HTML のレポート（成果物）に残す
      - name: Coverage report
        run: |
          nix develop -c make cover-html
          total=$(nix develop -c go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          {
            echo "## Coverage: ${total}"
            echo
            echo "<details><summary>関数ごとのカバレッジ</summary>"
            echo
            echo '```'
            nix develop -c go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
            echo
            echo "HTML のレポートは、この実行の成果物（coverage-report）にある。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

      - name: Build
        run: nix develop -c make build

      - name: Save Go cache
        if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # コンテナイメージがビルドできることを確かめる（push はしない。push は CD で行う）
  image:
    runs-on: ubuntu-latest
    name: Build container image

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: make image CONTAINER=docker
