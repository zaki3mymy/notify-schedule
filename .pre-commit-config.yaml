# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: check-yaml

# Go のフックは make のターゲットを呼ぶ（ローカルと CI で同じコマンドを使うため）
-   repo: local
    hooks:
    -   id: make-fmt
        name: make fmt
        entry: make fmt
        language: system
        files: \.go$
        pass_filenames: false

    -   id: make-lint
        name: make lint
        entry: make lint
        language: system
        files: (\.go$|^go\.(mod|sum)$|^\.golangci\.yml$)
        pass_filenames: false

    -   id: make-test
        name: make test
        entry: make test
        language: system
        files: (\.go$|^go\.(mod|sum)$)
        pass_filenames: false

    -   id: actionlint
        name: GitHub Actions lint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.+\.ya?ml$

default_install_hook_types: [pre-commit]
